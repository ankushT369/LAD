<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">LAD log anomaly detection architecture</title>
  <desc id="desc">Log files flow through Fluentd and a Python watcher into Qdrant for vector search. Retrieved context and the new log are classified by Gemini, with results written to a JSONL event file and shown in the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b20"/><stop offset="1" stop-color="#0d1419"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf5d8"/><stop offset="1" stop-color="#5dd3a1"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60957e"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{fill:#edf5ef;font-size:17px;font-weight:650}.sub{fill:#93a49e;font-size:12px}.tag{fill:#70d5aa;font-size:10px;font-weight:700;letter-spacing:1px}.step{fill:#15231f;stroke:#284338}.box{fill:#131d22;stroke:#2b3b3c}.arrow{fill:none;stroke:#60957e;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="390" rx="24" fill="url(#bg)"/>
  <text x="42" y="43" class="tag">THE LAD PIPELINE</text>
  <text x="1078" y="43" text-anchor="end" class="sub">Local processing · semantic context · actionable output</text>
  <path class="arrow" d="M192 165h38"/><path class="arrow" d="M377 165h38"/><path class="arrow" d="M562 165h38"/><path class="arrow" d="M747 165h38"/><path class="arrow" d="M932 165h38"/>
  <g transform="translate(36 93)"><rect class="box" width="156" height="144" rx="15"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">01</text><text x="20" y="67" class="title">Your log files</text><text x="20" y="91" class="sub">OS and app logs</text><text x="20" y="111" class="sub">configured as inputs</text><path d="M20 124h82" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(221 93)"><rect class="box" width="156" height="144" rx="15"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">02</text><text x="20" y="67" class="title">Fluentd</text><text x="20" y="91" class="sub">Collects and forwards</text><text x="20" y="111" class="sub">records to the daemon</text><path d="M20 124h58" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(406 93)"><rect class="box" width="156" height="144" rx="15"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">03</text><text x="20" y="67" class="title">Python watcher</text><text x="20" y="91" class="sub">Embeds each line</text><text x="20" y="111" class="sub">and searches Qdrant</text><path d="M20 124h96" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(591 93)"><rect class="box" width="156" height="144" rx="15"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">04</text><text x="20" y="67" class="title">Qdrant + Gemini</text><text x="20" y="91" class="sub">Finds similar history;</text><text x="20" y="111" class="sub">classifies with context</text><path d="M20 124h110" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(776 93)"><rect class="box" width="156" height="144" rx="15"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">05</text><text x="20" y="67" class="title">Event record</text><text x="20" y="91" class="sub">Status, explanation,</text><text x="20" y="111" class="sub">suggested fix in JSONL</text><path d="M20 124h84" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(961 93)"><rect x="0" y="0" width="123" height="144" rx="15" fill="#14241d" stroke="#3c7058"/><circle class="step" cx="24" cy="25" r="14"/><text x="24" y="29" text-anchor="middle" class="tag">06</text><text x="18" y="67" class="title">Dashboard</text><text x="18" y="91" class="sub">Live metrics</text><text x="18" y="111" class="sub">and event stream</text><path d="M18 124h68" stroke="url(#mint)" stroke-width="2" stroke-linecap="round"/></g>
  <path d="M669 239v56H484v-48" fill="none" stroke="#405c50" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="574" y="317" text-anchor="middle" class="sub">Similar historical logs are retrieved as context for each classification</text>
  <text x="42" y="361" class="sub">A new event is first marked “processing”, then updated with the analysis result.</text>
</svg>
